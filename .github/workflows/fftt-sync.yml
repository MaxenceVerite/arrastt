name: Sync FFTT Data

on:
  schedule:
    # Run every day at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      sync_type:
        description: 'Quelles données synchroniser ?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - players
          - club
          - teams
          - matches
          - stats

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run FFTT Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FFTT_CLUB_ID: ${{ secrets.FFTT_CLUB_ID }}
        run: npm run sync:fftt -- ${{ github.event.inputs.sync_target || '--all' }}
