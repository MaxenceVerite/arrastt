name: Sync FFTT Data

on:
  schedule:
    # Run every day at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      sync_type:
        description: 'Cible de synchronisation (Que voulez-vous mettre à jour ?)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - stats
          - matches
          - teams
          - players
          - club
      full_history:
        description: '⚠️ Forcer le téléchargement de TOUT l\'historique des joueurs (très lent, utile uniquement si données perdues)'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run FFTT Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FFTT_CLUB_ID: ${{ secrets.FFTT_CLUB_ID }}
        run: |
          ARGS="--${{ github.event.inputs.sync_type || 'all' }}"
          if [ "${{ github.event.inputs.full_history }}" = "true" ]; then
            ARGS="$ARGS --full-history"
          fi
          npm run sync:fftt -- $ARGS
